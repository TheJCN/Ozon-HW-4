services:
  db:
    image: postgres:16-alpine
    container_name: ozon-hw4-db
    environment:
      POSTGRES_DB: ozon_hw4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
      - ./:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozon_hw4"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
